name: Build and Test

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
      env:
        CI: true
    - name: Build project
      run: npm run build
      env:
        CI: true
    - name: Run linting
      run: |
        # Run linting if available
        if [ -f ".eslintrc" ]; then
          npx eslint src/ || echo "ESLint issues found but continuing..."
        fi
      env:
        CI: true

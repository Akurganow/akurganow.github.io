name: Deploy

on:
  push:
    branches:
      - main
      - master
      - copilot/fix-214

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master'

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    - name: npm install and deploy
      run: |
        npm ci
        npm run deploy
      env:
        CI: true
